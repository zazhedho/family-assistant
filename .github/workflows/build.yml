name: Build Family Assistant Image

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/build.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'migrations/**'
      - 'compose.yaml'

concurrency:
  group: family-assistant-image-build-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push AMD64 and ARM64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/family-assistant:latest
            ghcr.io/${{ github.repository_owner }}/family-assistant:${{ github.sha }}
