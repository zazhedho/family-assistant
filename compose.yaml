services:
  backend:
    container_name: family-assistant
    image: ghcr.io/zazhedho/family-assistant:latest
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:1000:8081"
    volumes:
      - /var/log/apps/family-assistant:/var/log/family-assistant
